name: Cloudflare Workers Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test against https://cataito.com/en after deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run pages:build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy .open-next --minify

      - name: Smoke test
        if: always()
        run: |
          sleep 15
          curl -sSI https://cataito.com/en | grep -E "^(HTTP|content-type|server)" | head -5
