name: Cloudflare Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test against https://cataito.com/en after deploy'
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: 8f9029f4b262cd970bccf8e07200942e
      CF_PROJECT_NAME: cataito

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v3
        with:
          apiKey: ${{ secrets.CF_API_TOKEN }}
          accountID: ${{ env.CF_ACCOUNT_ID }}
          projectName: ${{ env.CF_PROJECT_NAME }}
          directory: out
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test (opt-in via workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test == true }}
        run: |
          echo "Running smoke test against https://cataito.com/en ..."
          curl -sSI https://cataito.com/en | head -20
          echo "---"
          curl -sSI https://cataito.com/en/tool/chatgpt | head -20
          echo "---"
          curl -sSI https://cataito.com/zh | head -20
          echo "---"
          curl -sSI https://cataito.com/tool/chatgpt | head -20
