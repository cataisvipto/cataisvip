name: Cloudflare Workers Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test against https://cataito.com/en after deploy'
        required: false
        default: false
        type: boolean

env:
  CF_ACCOUNT_ID: 8f9029f4b262cd970bccf8e07200942e

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run pages:build

      - name: Verify build output
        run: |
          ls -la .open-next/worker.js
          du -sh .open-next/
          find .open-next/assets -type f | wc -l

      # Use direct npx wrangler instead of cloudflare/wrangler-action@v3 which
      # silently failed (exit code 1 without useful logs). Pass --config
      # explicitly because the config is named wrangler.jsonc.
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --minify

      - name: Print next steps
        run: |
          echo "Worker deployed. Check https://cataito.zhyoyx.workers.dev/en"
          echo "Manual domain binding: dash.cloudflare.com -> Workers & Pages -> cataito"
          echo "  -> Settings -> Domains & Routes -> Add -> Custom domain -> cataito.com"

      - name: Smoke test (only if smoke_test=true)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test == true }}
        run: |
          sleep 15
          curl -sSI https://cataito.com/en | grep -E "^(HTTP|content-type|server)" | head -5
