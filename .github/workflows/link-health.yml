name: Internal Audit

on:
  schedule:
    # 每周一 UTC 22:23（北京时间周二早 6:23）自动审计；避开整点防 GitHub 静默丢弃
    - cron: '23 22 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 只需 undici 一个依赖，装全量 node_modules 太慢
      - run: npm i --no-save undici

      # 唯一会 fail 的步骤：官网 DEAD 时 exit 1
      - name: ① 工具/Skills/MCP 官网存活审核
        run: node scripts/check-tool-liveness.mjs

      # 以下审计均为 warn-only（脚本恒 exit 0），报告写入 STEP_SUMMARY 周报面板
      - name: ② 信息过期检测
        if: always()
        run: node scripts/audit-freshness.mjs

      - name: ③ Verdict 腐化扫描
        if: always()
        run: node scripts/audit-verdict-tokens.mjs

      - name: ④ Pricing 漂移探测
        if: always()
        run: node scripts/audit-pricing-drift.mjs
