name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 内部文件推送禁令：远端检测兜底（本地 .git/hooks/pre-push 阶段 2 为第一道预防，
      # 匹配规则与其保持一致，另含 AGENTS.md push-guard 的 _internal/ 与 .env* 模式）
      - name: 检查禁止上传的内部文件
        run: |
          forbidden=$(git -c core.quotepath=false ls-files | awk '
          {
            path = $0
            base = path
            sub(/.*\//, "", base)
            isRoot = (path !~ /\//)
            bad = 0
            if (isRoot && path ~ /\.html$/) bad = 1
            if (isRoot && path ~ /\.md$/ && base != "README.md") bad = 1
            if (base ~ /-editor\.html$/) bad = 1
            if (path ~ /^_internal\//) bad = 1
            if (base ~ /^\.env/) bad = 1
            if (bad) print path
          }')
          if [ -n "$forbidden" ]; then
            echo "🚫 检测到禁止上传的内部/运营文件已进入仓库："
            echo "$forbidden" | sed 's/^/   - /'
            echo "请立即 git rm --cached 移除并排查泄露内容（本步骤是泄露后的快速发现手段，不构成预防）。"
            exit 1
          fi
          echo "✅ 未发现禁止上传的内部文件"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npx next build

      # 启动生产服务器进行冒烟测试
      - name: 启动本地服务器
        run: |
          npx next start &
          echo "PID=$!"
          # 等待服务器就绪（最多尝试 30 次，每次 2 秒）
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/en | grep -q 200; then
              echo "服务器就绪"
              break
            fi
            echo "等待服务器... ($i/30)"
            sleep 2
          done

      - name: 运行冒烟测试
        run: node scripts/smoke-test.mjs

      - name: 停止本地服务器
        if: always()
        run: kill $(lsof -t -i:3000) 2>/dev/null || true
