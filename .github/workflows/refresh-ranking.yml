name: Update Ranking

# 每日自动刷新 GitHub AI 项目排行榜 + 快照。
# 双 cron 兜底：GitHub 对低活跃仓库的 schedule 是"尽力而为"，高峰期会被静默丢弃。
# 两个错峰时刻各跑一次，任一被丢由另一顶上；都跑到也无害（当日快照覆盖写、无变化不提交）。
# 同时支持手动触发。
#
# 数据双通道发布（不再依赖主站重新部署）：
#   ① main 分支：保留 ranking.json 快照 + 每日 star 快照（git 历史可回溯）
#   ② pages-data 分支：发布到 GitHub Pages（https://cataito-lab.github.io/ranking.json），
#      排名页客户端实时拉取——数据一更新，页面立即可见，无需整站重发版。
on:
  schedule:
    - cron: '37 0 * * *' # 主跑：每日 UTC 00:37（北京 08:37）。勿用整点：UTC 00:00 是 GitHub cron 高峰
    - cron: '53 2 * * *' # 备份：每日 UTC 02:53（北京 10:53）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 运行排行榜算法
        run: node scripts/github-ranking/rank.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交并推送快照（main 分支）
        id: main-push
        run: |
          git add src/data/ranking.json snapshots
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): 自动刷新排行榜及快照（$(TZ='Asia/Shanghai' date +%Y-%m-%d)）"
          for i in 1 2 3; do
            if git push 2>&1; then
              echo "推送成功（main）"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "推送失败，第 $i 次重试（pull --rebase）..."
            git pull --rebase --no-edit 2>/dev/null || true
            sleep 2
          done
          echo "重试耗尽，推送失败（main）"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 排行榜更新失败 $(TZ='Asia/Shanghai' date +%Y-%m-%d)" \
            --body "定时任务运行失败（可能是数据熔断触发或 API 异常）。快照断档无法回补，请尽快排查并手动重跑。日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  publish-pages:
    name: 发布活数据到 GitHub Pages
    needs: rank
    if: needs.rank.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: 提交并推送到 pages-data 分支（仅放 ranking.json 到根目录）
        # 核心原则：新 commit 以远端 pages-data 当前 HEAD 为父 → 普通 push，避开 ruleset 拦截
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ① 确保本地 main 是最新的
          git fetch origin main --prune

          # ② 拉远端 pages-data 最新状态（没有的话后续会建）
          git fetch origin pages-data 2>/dev/null || true

          # ③ 把 main 最新的 ranking.json 存到临时位置
          mkdir -p .tmp-rank
          cp src/data/ranking.json .tmp-rank/ranking.json

          # ④ 在 pages-data 的树（只有根目录 ranking.json 这一份内容）之上，
          #    用 main 的新数据生成一个新 commit。这样新 commit 的父节点是远端
          #    pages-data 的 HEAD，push 就是普通 push、非强推，ruleset 不会拦。
          #    用 plumbing 命令拼树，避免 checkout 整个 main 工作树（609 文件全上）。
          if git rev-parse -q --verify origin/pages-data^{commit} >/dev/null; then
            BASE=origin/pages-data
          else
            # 远端 pages-data 还不存在：先建一个空的根提交
            EMPTY=$(git hash-object -t tree /dev/null)
            BASE=$(git commit-tree -m "chore: init ranking live" "$EMPTY")
          fi

          # 从 BASE 的树（只含 ranking.json）复制出来，把 ranking.json 换成新数据，再打 commit
          BASE_TREE=$(git rev-parse "$BASE^{tree}")
          git read-tree "$BASE_TREE"
          rm -f ranking.json
          cp .tmp-rank/ranking.json ranking.json

          # 内容完全一致则跳过（不刷 commit）
          git add ranking.json
          if git diff --cached --quiet; then
            echo "ranking.json 与上次相同，跳过推送"
            exit 0
          fi

          # 新 commit 的父 = BASE（远端 pages-data 的 HEAD），普通 push 安全
          NEW_TREE=$(git write-tree)
          NEW_COMMIT=$(git commit-tree -p "$BASE" -m "chore(data): ranking live $DATE" "$NEW_TREE")

          # ⑤ 常规 push（非 --force）：新 commit 有远端 HEAD 为父，属正常前进
          for i in 1 2 3; do
            if git push origin "$NEW_COMMIT:pages-data" 2>&1; then
              echo "推送成功（pages-data）"
              break
            fi
            echo "推送失败，第 $i 次重试（重新 fetch pages-data）..."
            git fetch origin pages-data 2>/dev/null || true
            BASE=$(git rev-parse origin/pages-data^{commit})
            BASE_TREE=$(git rev-parse "$BASE^{tree}")
            git read-tree "$BASE_TREE"
            rm -f ranking.json && cp .tmp-rank/ranking.json ranking.json
            git add ranking.json
            NEW_TREE=$(git write-tree)
            NEW_COMMIT=$(git commit-tree -p "$BASE" -m "chore(data): ranking live $DATE" "$NEW_TREE")
            sleep 2
          done

          echo "已发布到 https://cataito-lab.github.io/cataito/ranking.json"