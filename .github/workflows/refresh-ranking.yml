name: Refresh GitHub Ranking

# GitHub AI 项目排行榜定时刷新
# 每日 UTC 20:47 自动运行（与 refresh-stars 同一时间，星数同步刷新）
# 同时支持手动触发

on:
  schedule:
    # 每日 UTC 20:47（北京时间凌晨 4:47）
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行排行榜算法
        run: node scripts/github-ranking/rank.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交并推送
        run: |
          if git diff --quiet -- src/data/githubRanking.json; then
            echo "榜单无变化，跳过提交"
            exit 0
          fi
          git config user.name "CATAI"
          git config user.email "309386950+cataisvipto@users.noreply.github.com"
          git add src/data/githubRanking.json
          git commit -m "chore(data): 自动刷新 GitHub 排行榜（$(date +%Y-%m-%d)）"
          # 重试策略：远程有更新时 pull --rebase 再推（最多 3 次）
          for i in 1 2 3; do
            if git push 2>&1; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失败，第 $i 次重试（pull --rebase）..."
            git pull --rebase --no-edit 2>/dev/null || true
            sleep 2
          done
          echo "重试耗尽，推送失败"
          exit 1