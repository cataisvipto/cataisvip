<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Inter','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="topfade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#0B1118" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0B1118" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B1118" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="botfade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"  stop-color="#0B1118" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0B1118" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C9DD6"/>
      <stop offset="100%" stop-color="#A8C4E8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0B1118"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Hero image (公众号原文头图) as wide visual band, bottom, no cropping -->
  <g transform="translate(0,360)">
    <rect x="0" y="0" width="1200" height="315" fill="url(#topfade)" opacity="0.7"/>
    <image x="0" y="20" width="1200" height="295" href="/blog/images/deepseek-v4-flash-vision-exp-multimodal-api-launch/hero.jpg"/>
    <rect x="0" y="0" width="1200" height="315" fill="url(#botfade)"/>
  </g>

  <!-- Top-left brand tag -->
  <g transform="translate(80,70)">
    <rect x="0" y="0" width="5" height="26" fill="url(#accent)"/>
    <text x="18" y="19" fill="#A8C4E8" font-size="12" font-weight="600" letter-spacing="2.5">DEEPSEEK · API UPDATE</text>
  </g>

  <text x="80" y="150" fill="#8896AB" font-size="13" font-weight="500" letter-spacing="1.5">MULTIMODAL · EXPERIMENTAL · LIVE</text>

  <text x="80" y="240" fill="#F0F4FA" font-size="64" font-weight="800" letter-spacing="-1.5">VISION,</text>
  <text x="80" y="305" fill="#A8C4E8" font-size="64" font-weight="800" letter-spacing="-1.5">ACTIVATED.</text>

  <text x="80" y="340" fill="#D4DBE6" font-size="17" font-weight="400">DeepSeek V4-Flash-Vision-Exp 多模态 API 上线</text>

  <text x="80" y="588" fill="#6C7A8C" font-size="11" font-weight="500" letter-spacing="1.5">ACCESS VIA API</text>
  <text x="80" y="614" fill="#A8C4E8" font-size="14" font-weight="500" font-family="'JetBrains Mono','Fira Code',monospace">model = 'deepseek-v4-flash-vision-exp'</text>

  <g transform="translate(80,658)">
    <text x="0" y="0" fill="#5C6A7E" font-size="10" font-weight="600" letter-spacing="3">CATAITO</text>
    <text x="80" y="0" fill="#5C6A7E" font-size="10" font-weight="400" letter-spacing="1">— AI DISCOVERY ENGINE</text>
  </g>

  <g transform="translate(960,658)">
    <text x="0" y="0" fill="#5C6A7E" font-size="10" font-weight="500" letter-spacing="1.5">news · 2026.08.21</text>
  </g>
</svg>